<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FBBF24" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#FBBF24" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#27272A" stroke-width="0.6"/>
    </pattern>
  </defs>

  <!-- Backgrounds -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.4"/>
  <ellipse cx="950" cy="310" rx="410" ry="290" fill="url(#glow)"/>

  <!-- Top label -->
  <circle cx="84" cy="66" r="4" fill="#FBBF24"/>
  <text x="102" y="71" font-size="14" font-weight="500" letter-spacing="2" fill="#A1A1AA">CHROME EXTENSION</text>

  <!-- Title (2 lines) -->
  <text x="80" y="250" font-size="64" font-weight="800" letter-spacing="-2" fill="#FAFAFA">YouTube Hidden</text>
  <text x="80" y="322" font-size="64" font-weight="800" letter-spacing="-2" fill="#FAFAFA">Shorts</text>

  <!-- Tagline -->
  <text x="80" y="382" font-size="22" font-weight="600" fill="#FBBF24">Hide YouTube Shorts everywhere</text>

  <!-- Description -->
  <text x="80" y="424" font-size="18" font-weight="400" fill="#A1A1AA">Removes Shorts from feed, search, sidebar and channel</text>
  <text x="80" y="448" font-size="18" font-weight="400" fill="#A1A1AA">pages. Always on — no toggle, no tracking.</text>

  <!-- Footer pills -->
  <g font-size="14" font-weight="500">
    <rect x="80" y="545" width="120" height="30" rx="15" fill="#18181B" stroke="#FBBF24"/>
    <text x="140" y="565" text-anchor="middle" fill="#FBBF24">Manifest V3</text>

    <rect x="212" y="545" width="84" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="254" y="565" text-anchor="middle" fill="#A1A1AA">Chrome</text>

    <rect x="308" y="545" width="106" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="361" y="565" text-anchor="middle" fill="#A1A1AA">JavaScript</text>

    <rect x="426" y="545" width="58" height="30" rx="15" fill="#18181B" stroke="#27272A"/>
    <text x="455" y="565" text-anchor="middle" fill="#A1A1AA">MIT</text>
  </g>

  <!-- Username -->
  <text x="1120" y="595" text-anchor="end" font-size="13" font-weight="500" fill="#52525B">@jeffersongoncalves</text>

  <!-- Right visual: browser-mock with blocked Shorts shelf -->
  <g transform="translate(680,150)">
    <!-- window -->
    <rect x="0" y="0" width="460" height="330" rx="14" fill="#18181B" stroke="#3F3F46"/>
    <!-- top bar -->
    <rect x="0" y="0" width="460" height="44" rx="14" fill="#0A0A0B"/>
    <rect x="0" y="30" width="460" height="14" fill="#0A0A0B"/>
    <circle cx="24" cy="22" r="5" fill="#EF4444"/>
    <circle cx="44" cy="22" r="5" fill="#FBBF24"/>
    <circle cx="64" cy="22" r="5" fill="#10B981"/>
    <rect x="92" y="12" width="344" height="20" rx="10" fill="#18181B" stroke="#27272A"/>
    <text x="108" y="26" font-size="12" font-family="ui-monospace, monospace" fill="#71717A">youtube.com</text>

    <!-- normal video rows (kept) -->
    <rect x="24" y="66" width="120" height="68" rx="8" fill="#27272A"/>
    <rect x="158" y="72" width="160" height="12" rx="6" fill="#3F3F46"/>
    <rect x="158" y="94" width="110" height="10" rx="5" fill="#27272A"/>
    <rect x="158" y="112" width="80" height="10" rx="5" fill="#27272A"/>

    <!-- Shorts shelf (blocked) -->
    <rect x="20" y="156" width="420" height="96" rx="10" fill="#0A0A0B" stroke="#3F3F46" stroke-dasharray="5 5"/>
    <g opacity="0.4">
      <rect x="36" y="172" width="56" height="64" rx="8" fill="#27272A"/>
      <rect x="100" y="172" width="56" height="64" rx="8" fill="#27272A"/>
      <rect x="164" y="172" width="56" height="64" rx="8" fill="#27272A"/>
      <rect x="228" y="172" width="56" height="64" rx="8" fill="#27272A"/>
      <text x="36" y="166" font-size="12" font-weight="600" fill="#71717A">Shorts</text>
    </g>
    <!-- red strike through shelf -->
    <line x1="36" y1="246" x2="404" y2="162" stroke="#EF4444" stroke-width="3" stroke-linecap="round"/>
    <!-- HIDDEN pill -->
    <rect x="300" y="186" width="104" height="34" rx="17" fill="#18181B" stroke="#FBBF24"/>
    <circle cx="322" cy="203" r="4" fill="#FBBF24"/>
    <text x="336" y="208" font-size="13" font-weight="600" fill="#FBBF24">HIDDEN</text>

    <!-- another normal row (kept) -->
    <rect x="24" y="272" width="120" height="44" rx="8" fill="#27272A"/>
    <rect x="158" y="280" width="150" height="12" rx="6" fill="#3F3F46"/>
    <rect x="158" y="300" width="96" height="10" rx="5" fill="#27272A"/>
  </g>
</svg>
